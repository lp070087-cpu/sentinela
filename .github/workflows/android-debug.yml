name: Sentinela Android debug
on:
  workflow_dispatch:
  push:
    branches: [main, work/sentinela-fase4]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check web and bundled demo
        run: |
          npm run check
          npm test
          node scripts/sync-demo.mjs --check
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Verify SDK installation
        run: |
          sdkmanager --version
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - name: Test and assemble Android
        working-directory: apps/android
        run: bash gradlew testDebugUnitTest assembleDebug --console=plain
      - name: Verify APK and record provenance
        working-directory: apps/android
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --verbose "$apk"
          "$tools/aapt" dump badging "$apk" > build-info.txt
          unzip -Z1 "$apk" | awk '/^classes([0-9]+)?\.dex$/ { dex=1 } /^assets\/.*demo-app\.html$/ { demo=1 } END { exit !(dex && demo) }'
          printf '\nCommit: %s\n' "$GITHUB_SHA" >> build-info.txt
          sha256sum "$apk" >> build-info.txt
          cat build-info.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: sentinela-debug-${{ github.sha }}
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/build-info.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: apps/android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
